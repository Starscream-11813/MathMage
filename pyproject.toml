[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathmage"
version = "2.0.0"
description = "MathMage: zone-aware multi-agent mathematical reasoning (zones of proximal development of language models)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anonymous Authors" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "pyarrow>=14",
  "pydantic>=2.5",
  "pyyaml>=6",
  "requests>=2.31",
  "matplotlib>=3.8",
  "sympy>=1.12",
  "math-verify[antlr4_13_2]>=0.7",
  "huggingface_hub>=0.20",
  "psutil>=5.9",
]

[project.optional-dependencies]
bayes = ["numpyro>=0.15", "jax>=0.4.30"]
embed = ["sentence-transformers>=2.6"]
dev = ["pytest>=8"]
figures = ["fonttools>=4.47"]

[tool.setuptools.packages.find]
include = ["mathmage", "mathmage.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
